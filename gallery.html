<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Gallery</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    h1 { margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 12px; }
    .title { font-weight: 600; margin: 0 0 8px; }
    video { width: 100%; height: auto; border-radius: 10px; background: #000; }
  </style>
</head>
<body>
  <h1>My Videos</h1>

  <div class="grid">
    <div class="card"><p class="title">Video 1</p><video controls preload="none" playsinline><source src="videos/video1.mp4" type="video/mp4"></video></div>
