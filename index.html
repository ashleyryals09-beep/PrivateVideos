<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Private Gallery</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    .wrap { max-width: 420px; margin: 10vh auto; border: 1px solid #ddd; border-radius: 14px; padding: 18px; }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { margin: 0 0 14px; color: #444; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
    button { margin-top: 10px; width: 100%; padding: 12px; border-radius: 10px; border: 0; font-size: 16px; cursor: pointer; }
    .err { margin-top: 10px; color: #b00020; display: none; }
    .hint { margin-top: 12px; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Enter Password</h1>
    <p>This page is private.</p>

    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="btn">Unlock</button>
    <div class="err" id="err">Wrong password.</div>

    <div class="hint">Tip: after you unlock once, it’ll remember this device.</div>
  </div>

  <script>
    // CHANGE THIS PASSWORD:
    const PASSWORD = "ChangeMe123!";

    const KEY = "gallery_unlocked_v1";

    // If already unlocked, go straight to gallery
    if (localStorage.getItem(KEY) === "yes") {
      window.location.replace("gallery.html");
    }

    function unlock() {
      const pw = document.getElementById("pw").value;
      const err = document.getElementById("err");

      if (pw === PASSWORD) {
        localStorage.setItem(KEY, "yes");
        window.location.href = "gallery.html";
      } else {
        err.style.display = "block";
      }
    }

    document.getElementById("btn").addEventListener("click", unlock);
    document.getElementById("pw").addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlock();
    });
  </script>
</body>
</html>
